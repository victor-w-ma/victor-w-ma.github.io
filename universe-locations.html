    const activeScales = new Set(Object.keys(SCALES));
    let searchQuery = "";
    let focusedSlug = null;

    const map = L.map("map", { zoomControl: true }).setView([35.2, 105.0], 4);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap &copy; CARTO",
      subdomains: "abcd",
      maxZoom: 19,
    }).addTo(map);

    const markerLayer = L.layerGroup().addTo(map);
    const markersByCity = {};

    function scaleTag(scale) {
      const s = SCALES[scale];
      return `<span class="scale-tag" style="background:${s.color}22;color:${s.color};border:1px solid ${s.color}55">${s.label}</span>`;
    }

    function zoneTag(zone) {
      return `<span class="zone-tag" style="background:#ffffff10;color:#c5d0e0;border:1px solid #ffffff18">${ZONES[zone] || zone}</span>`;
    }

    function postPath(slug) {
      return `_posts/${slug}.md`;
    }

    function cityIdsForPost(p) {
      if (p.cityIds && p.cityIds.length) return p.cityIds;
      return p.cityId ? [p.cityId] : [];
    }

    function cityForPost(p) {
      const id = p.cityId || cityIdsForPost(p)[0];
      return id ? CITIES[id] : null;
    }

    function postSearchHay(p) {
      const c = cityForPost(p);
      return [
        p.title, p.scene, p.slug, SCALES[p.scale].label,
        c && c.name, c && c.analog, c && c.inference, c && ZONES[c.zone],
      ].filter(Boolean).join(" ").toLowerCase();
    }

    function filteredPosts() {
      const q = searchQuery.trim().toLowerCase();
      return POSTS.filter((p) => {
        if (!activeScales.has(p.scale)) return false;
        if (!q) return true;
        return postSearchHay(p).includes(q);
      });
    }

    function cityScaleFromPosts(posts) {
      const order = ["metropolis", "major", "regional", "county", "overseas"];
      let best = posts[0].scale;
      for (const p of posts) {
        if (order.indexOf(p.scale) < order.indexOf(best)) best = p.scale;
      }
      return CITIES[posts[0].cityId]?.scale || best;
    }

    function renderScaleFilters() {
      const el = document.getElementById("scale-filters");
      el.innerHTML = Object.entries(SCALES).map(([key, s]) =>
        `<button type="button" class="chip active" data-scale="${key}">
          <span class="dot" style="background:${s.color}"></span>${s.label}
        </button>`
      ).join("");
      el.querySelectorAll(".chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          const k = btn.dataset.scale;
          btn.classList.toggle("active");
          if (activeScales.has(k)) activeScales.delete(k); else activeScales.add(k);
          render();
        });
      });
    }

    function renderList() {
      const list = document.getElementById("post-list");
      const posts = filteredPosts().sort((a, b) => a.title.localeCompare(b.title, "zh"));
      list.innerHTML = posts.map((p) => {
        const c = cityForPost(p);
        const loc = c ? `${c.name}${c.fictional ? "（虚构）" : ""}` : "—";
        return `
        <li class="post-item${focusedSlug === p.slug ? " focused" : ""}" data-slug="${p.slug}" data-city="${p.cityId || ""}">
          <a href="${postPath(p.slug)}">
            <div class="post-title">${p.title}</div>
            <div class="post-meta">${scaleTag(p.scale)}${loc} — ${p.scene}</div>
          </a>
        </li>`;
      }).join("");

      const anchored = filteredPosts().filter((p) => cityIdsForPost(p).length);
      const cityIds = new Set(anchored.flatMap((p) => cityIdsForPost(p)));
      document.getElementById("stats").textContent =
        `显示 ${posts.length} / ${POSTS.length} 篇 · 地图 ${cityIds.size} 个城市`;

      list.querySelectorAll(".post-item").forEach((li) => {
        li.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          e.preventDefault();
          focusPost(li.dataset.slug, li.dataset.city);
        });
      });
    }

    function renderUnanchored() {
      const grid = document.getElementById("unanchored-grid");
      const posts = filteredPosts().filter((p) => !p.cityId);
      grid.innerHTML = posts.map((p) => `
        <article class="card">
          <h3><a href="${postPath(p.slug)}" style="color:inherit">${p.title}</a></h3>
          <p>${scaleTag(p.scale)}${p.scene}</p>
        </article>
      `).join("");
    }

    function buildPopup(cityId, posts) {
      const c = CITIES[cityId];
      const scale = cityScaleFromPosts(posts);
      const scaleLabel = SCALES[scale].label;
      const zoneLabel = ZONES[c.zone];
      const analog = c.analog ? `<br><strong>约当：</strong>${c.analog}` : "";
      const fict = c.fictional ? "（虚构地名）" : "";
      return `
        <div class="popup-title">${c.name}${fict}</div>
        <div class="popup-sub">${zoneTag(c.zone)} ${scaleTag(scale)} <strong>${posts.length} 篇</strong><br>${scaleLabel} · ${zoneLabel}${analog}</div>
        <div class="popup-infer">${c.inference}</div>
        <ul class="popup-posts">${posts.map((p) =>
          `<li><a href="${postPath(p.slug)}">${p.title}</a><span class="scene">${p.scene}</span></li>`
        ).join("")}</ul>`;
    }

    function renderMap() {
      markerLayer.clearLayers();
      Object.keys(markersByCity).forEach((k) => delete markersByCity[k]);

      const byCity = {};
      filteredPosts().forEach((p) => {
        cityIdsForPost(p).forEach((cityId) => {
          if (!byCity[cityId]) byCity[cityId] = [];
          byCity[cityId].push(p);
        });
      });

      Object.entries(byCity).forEach(([cityId, posts]) => {
        const c = CITIES[cityId];
        const scale = cityScaleFromPosts(posts);
        const color = SCALES[scale].color;
        const n = posts.length;
        const size = Math.min(36, Math.max(22, 18 + n * 2));
        const icon = L.divIcon({
          className: "",
          html: `<div class="city-marker" style="width:${size}px;height:${size}px;background:${color};font-size:${n > 9 ? 9 : 10}px">${n}</div>`,
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2],
        });
        const m = L.marker([c.lat, c.lng], { icon })
          .bindPopup(buildPopup(cityId, posts), { maxWidth: 360 });
        m._cityId = cityId;
        m._slugSet = new Set(posts.map((p) => p.slug));
        markersByCity[cityId] = m;
        markerLayer.addLayer(m);
      });
    }

    function focusPost(slug, cityId) {
      focusedSlug = slug;
      renderList();
      const p = POSTS.find((x) => x.slug === slug);
      const targetCity = cityId || (p && cityIdsForPost(p)[0]);
      if (!targetCity) return;
      const c = CITIES[targetCity];
      const m = markersByCity[targetCity];
      if (!c || !m) return;
      const zoom = c.scale === "metropolis" ? 10 : c.scale === "overseas" ? 5 : c.scale === "county" ? 9 : 8;
      map.setView([c.lat, c.lng], zoom, { animate: true });
      m.openPopup();
    }

    function render() {
      renderList();
      renderMap();
      renderUnanchored();
    }

    document.getElementById("search").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      render();
    });

    renderScaleFilters();
    render();
  </script>
