---
layout: base
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title{% if page.title_en %} has-en notranslate{% endif %}"{% if page.title_en %} translate="no"{% endif %}>
      {%- if page.title_en -%}
        <span class="lang-zh">{{ page.title | escape }}</span><span class="lang-en">{{ page.title_en | escape }}</span>
      {%- else -%}
        {{ page.title | escape }}
      {%- endif -%}
    </h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
