<div id="inline-comment-toolbar" class="inline-comment-toolbar" hidden>
  <button type="button" id="inline-comment-add-btn" class="inline-comment-add-btn">
    <span class="material-icons" aria-hidden="true">mode_comment</span>
    评论
  </button>
</div>

<div id="inline-comment-backdrop" class="inline-comment-backdrop" hidden></div>

<div id="inline-comment-panel" class="inline-comment-panel" hidden role="dialog" aria-labelledby="inline-comment-panel-title">
  <div class="inline-comment-panel-inner">
    <header class="inline-comment-panel-header">
      <h2 id="inline-comment-panel-title">评论这段话</h2>
      <button type="button" class="inline-comment-close" aria-label="关闭">×</button>
    </header>
    <blockquote class="inline-comment-quote" hidden></blockquote>
    <div class="inline-comment-thread"></div>
    <form class="inline-comment-form">
      <input type="text" name="nickname" placeholder="昵称" required autocomplete="nickname">
      <textarea name="comment" placeholder="写下你的评论" required></textarea>
      <div class="inline-comment-form-actions">
        <button type="submit">发布</button>
      </div>
      <p class="inline-comment-error" hidden></p>
    </form>
  </div>
</div>

<script>
  window.INLINE_COMMENTS_POST_ID = {{ page.url | slugify | jsonify }};
</script>
<script src="{{ '/assets/js/inline-comments.js' | relative_url }}"></script>

<style>
