<style>
  /* Scale site type from Minima's 16px base to 20px (×1.25). Rem rules follow html. */
  /* Custom widgets follow the same light/dark switch as Minima's auto skin. */
  :root {
    color-scheme: light;
    --c-ink: #333;
    --c-ink-strong: #111;
    --c-muted: #828282;
    --c-muted-2: #636363;
    --c-faint: #888;
    --c-faint-2: #666;
    --c-quote: #555;
    --c-fill: #f0f0f0;
    --c-fill-hover: #e0e0e0;
    --c-fill-active: #d0d0d0;
    --c-fill-soft: #f9f9f9;
    --c-fill-quiet: #f5f5f5;
    --c-surface: #fff;
    --c-quote-bg: #faf6f6;
    --c-line: #ddd;
    --c-line-3: #ccc;
    --c-line-4: #eee;
    --c-line-focus: #bbb;
    --c-press: #222;
    --c-danger: #a33;
    --c-shadow: rgba(0, 0, 0, 0.12);
    --c-shadow-lg: rgba(0, 0, 0, 0.14);
    --c-backdrop: rgba(0, 0, 0, 0.28);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --c-ink: #e4e4e4;
      --c-ink-strong: #f2f2f2;
      --c-muted: #9a9a9a;
      --c-muted-2: #a3a3a3;
      --c-faint: #9a9a9a;
      --c-faint-2: #b5b5b5;
      --c-quote: #c4b8b8;
      --c-fill: #2c2c2c;
      --c-fill-hover: #383838;
      --c-fill-active: #444444;
      --c-fill-soft: #242424;
      --c-fill-quiet: #2a2a2a;
      --c-surface: #222222;
      --c-quote-bg: #2a2222;
      --c-line: #444444;
      --c-line-3: #4a4a4a;
      --c-line-4: #333333;
      --c-line-focus: #666666;
      --c-press: #3f3f3f;
      --c-danger: #e07a7a;
      --c-shadow: rgba(0, 0, 0, 0.45);
      --c-shadow-lg: rgba(0, 0, 0, 0.55);
      --c-backdrop: rgba(0, 0, 0, 0.62);
    }
  }

  html {
    font-size: 20px;
    color-scheme: light dark;
  }

  input,
  textarea,
  select {
    background-color: var(--c-surface);
    color: var(--c-ink);
  }

  body {
    font-size: 20px;
    line-height: 1.65;
  }

  /* Former absolute px sizes, retargeted to the new base. */
  .post-meta,
  figcaption,
  code.highlighter-rouge {
    font-size: 0.875rem; /* was 14px @16 → 17.5px @20 */
  }

  pre {
    font-size: 0.9375rem; /* was 15px @16 → 18.75px @20 */
  }

  .post-status-badge {
    display: inline-block;
    box-sizing: border-box;
    min-width: 2.35em;
    color: #fff;
    font-size: 0.75em;
    font-weight: 500;
    font-style: normal;
    line-height: 1.4;
    padding: 0.08em 0.32em;
    border-radius: 0.28em;
    margin-right: 0.45em;
    vertical-align: 0.08em;
    text-align: center;
  }

  .post-status-badge.is-updated {
    background: #b36e6e;
  }

  .post-status-badge.is-serializing {
    background: #74b484;
  }

  .post-status-badge.is-complete {
    background: #6e757c;
  }

  .post-status-badge.is-hiatus {
    background: #7c7874;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var NEW_DAYS = 15;
    var BADGE_CLASS = {
      '更新': 'is-updated',
      '续写': 'is-serializing',
      '连载': 'is-serializing',
      '完结': 'is-complete',
      '断更': 'is-hiatus'
    };

    function pad2(n) {
      return n < 10 ? '0' + n : String(n);
    }

    function todayYmd() {
      var d = new Date();
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }

    function daysBetween(olderYmd, newerYmd) {
      var a = olderYmd.split('-');
      var b = newerYmd.split('-');
      var da = new Date(Number(a[0]), Number(a[1]) - 1, Number(a[2]));
      var db = new Date(Number(b[0]), Number(b[1]) - 1, Number(b[2]));
      return Math.round((db - da) / 86400000);
    }

    function applyBadge(timeEl, label) {
      var badge = timeEl.previousElementSibling;
      if (!badge || !badge.classList || !badge.classList.contains('post-status-badge')) {
        badge = document.createElement('span');
        timeEl.parentNode.insertBefore(badge, timeEl);
      }
      badge.className = 'post-status-badge ' + (BADGE_CLASS[label] || BADGE_CLASS['完结']);
      badge.setAttribute('aria-label', label);
      badge.textContent = label;
    }

    var today = todayYmd();
    var nodes = document.querySelectorAll('time[data-day]');
    for (var i = 0; i < nodes.length; i++) {
      var timeEl = nodes[i];
      var day = timeEl.getAttribute('data-day');
      var base = timeEl.getAttribute('data-status') || '完结';
      if (!BADGE_CLASS[base]) {
        base = '完结';
      }
      var label = base;
      if (day) {
        var age = daysBetween(day, today);
        if (age >= 0 && age <= NEW_DAYS) {
          label = '更新';
        }
      }
      applyBadge(timeEl, label);
    }
  });
</script>
