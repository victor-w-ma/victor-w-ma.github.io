<script>
  (function () {
    var lang = 'zh';
    try {
      lang = localStorage.getItem('siteLang') || 'zh';
    } catch (err) {
      lang = 'zh';
    }
    if (lang === 'en') {
      document.documentElement.lang = 'en';
      document.documentElement.classList.add('lang-en');
    } else {
      document.documentElement.lang = 'zh-CN';
      document.documentElement.classList.remove('lang-en');
    }
    window.siteTr = function (zh, en) {
      return document.documentElement.classList.contains('lang-en') ? en : zh;
    };
  })();
</script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var NEW_DAYS = 15;
    var BADGE_CLASS = {
      '更新': 'is-updated',
      '续写': 'is-serializing',
      '连载': 'is-serializing',
      '完结': 'is-complete',
      '断更': 'is-hiatus'
    };
    var BADGE_EN = {
      '更新': 'Updated',
      '续写': 'Serial',
      '连载': 'Serial',
      '完结': 'Complete',
      '断更': 'Hiatus'
    };

    function pad2(n) {
      return n < 10 ? '0' + n : String(n);
    }

    function todayYmd() {
      var d = new Date();
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }

    function daysBetween(olderYmd, newerYmd) {
      var a = olderYmd.split('-');
      var b = newerYmd.split('-');
      var da = new Date(Number(a[0]), Number(a[1]) - 1, Number(a[2]));
      var db = new Date(Number(b[0]), Number(b[1]) - 1, Number(b[2]));
      return Math.round((db - da) / 86400000);
    }

    function applyBadge(timeEl, label) {
      var enLabel = BADGE_EN[label] || BADGE_EN['完结'];
      var badge = timeEl.previousElementSibling;
      if (!badge || !badge.classList || !badge.classList.contains('post-status-badge')) {
        badge = document.createElement('span');
        timeEl.parentNode.insertBefore(badge, timeEl);
      }
      badge.className = 'post-status-badge has-en notranslate ' + (BADGE_CLASS[label] || BADGE_CLASS['完结']);
      badge.setAttribute('translate', 'no');
      badge.setAttribute('aria-label', window.siteTr(label, enLabel));
      var zh = document.createElement('span');
      zh.className = 'lang-zh';
      zh.textContent = label;
      var en = document.createElement('span');
      en.className = 'lang-en';
      en.textContent = enLabel;
      badge.textContent = '';
      badge.appendChild(zh);
      badge.appendChild(en);
    }

    var today = todayYmd();
    var nodes = document.querySelectorAll('time[data-day]');
    for (var i = 0; i < nodes.length; i++) {
      var timeEl = nodes[i];
      var day = timeEl.getAttribute('data-day');
      var base = timeEl.getAttribute('data-status') || '完结';
      if (!BADGE_CLASS[base]) {
        base = '完结';
      }
      var label = base;
      if (day) {
        var age = daysBetween(day, today);
        if (age >= 0 && age <= NEW_DAYS) {
          label = '更新';
        }
      }
      applyBadge(timeEl, label);
    }
  });
</script>
