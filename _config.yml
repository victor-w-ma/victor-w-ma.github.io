title: 中文SM经典小说
title_en: "Classic Chinese SM Fiction"
lang: zh-CN
email: victorwsma@gmail.com
description: 高质量中文SM小说集合
description_en: "A collection of Chinese SM fiction"
baseurl: ""

markdown: kramdown
remote_theme: jekyll/minima

plugins:
  - jekyll-feed
  - jekyll-remote-theme

# Minima auto skin follows the OS / browser prefers-color-scheme setting.
minima:
  skin: auto

google_analytics: G-HYN8MF0VM4

# Keep header navigation explicit so utility docs don't appear as tabs.
header_pages:
  - contact.md

# Hide utility docs from site output/navigation.
exclude:
  - AGENTS.md
  - cursor-agent-chat-log.md
  - _works
  - _posts/archive
  - _posts/archive/**
